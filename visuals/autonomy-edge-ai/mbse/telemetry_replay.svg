<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="t d">
<title id="t">Telemetry formatter-parser replay</title>
<desc id="d">Three constructed software replay cases: valid control, truncated longitude accepted as 7.0, and malformed longitude silently substituted.</desc>
<rect width="1200" height="640" fill="#f8fafc"/>
<text x="60" y="72" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f172a">Producer → consumer boundary replay</text>
<text x="60" y="108" font-family="Arial,sans-serif" font-size="18" fill="#475569">Frozen formatter/parser methods · 49-character message boundary · constructed software cases, not flight incidents</text>
<rect x="60" y="150" width="1080" height="92" rx="18" fill="#e2e8f0"/>
<text x="90" y="188" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a">Aerial formatter</text>
<text x="275" y="188" font-family="monospace" font-size="17" fill="#334155">lat/lon (5 decimals) + optional event/count → message[:49]</text>
<path d="M535 218 L665 218" stroke="#64748b" stroke-width="5"/><polygon points="665,218 645,206 645,230" fill="#64748b"/>
<text x="710" y="188" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a">GCS parser</text>
<text x="710" y="218" font-family="Arial,sans-serif" font-size="16" fill="#475569">numeric parse / fallback behaviour</text>
<rect x="60" y="285" width="335" height="245" rx="20" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
<text x="90" y="330" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#166534">1 · Control</text><text x="90" y="370" font-family="Arial,sans-serif" font-size="17" fill="#166534">Short valid message</text><text x="90" y="410" font-family="Arial,sans-serif" font-size="17" fill="#334155">Coordinates preserved</text><text x="90" y="468" font-family="Arial,sans-serif" font-size="16" fill="#475569">Expected boundary behaviour</text>
<rect x="432" y="285" width="335" height="245" rx="20" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
<text x="462" y="330" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#9a3412">2 · Unsafe accept</text><text x="462" y="370" font-family="Arial,sans-serif" font-size="17" fill="#7c2d12">event=12345 · count=15</text><text x="462" y="410" font-family="monospace" font-size="18" fill="#7c2d12">… lon=7</text><text x="462" y="447" font-family="Arial,sans-serif" font-size="17" fill="#334155">Consumer accepted 7.0</text><text x="462" y="493" font-family="Arial,sans-serif" font-size="16" fill="#475569">Incomplete data looked valid</text>
<rect x="804" y="285" width="336" height="245" rx="20" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
<text x="834" y="330" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#991b1b">3 · Unsafe substitution</text><text x="834" y="370" font-family="Arial,sans-serif" font-size="17" fill="#7f1d1d">Negative-coordinate case</text><text x="834" y="410" font-family="Arial,sans-serif" font-size="17" fill="#334155">Longitude field became empty</text><text x="834" y="447" font-family="Arial,sans-serif" font-size="17" fill="#334155">Aircraft longitude substituted</text><text x="834" y="493" font-family="Arial,sans-serif" font-size="16" fill="#475569">Malformed target changed meaning</text>
<text x="60" y="590" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Derived controls: R-COORD explicit rejection · R-ORIGIN no silent origin substitution</text>
</svg>