<text x="66" y="691" class="h2">Aerial ↔ GCS</text><text x="288" y="678" class="body"><tspan x="288">FOD detections and coordinates</tspan><tspan x="288" dy="22">Mission updates / configuration</tspan></text><text x="856" y="691" class="status" fill="#167A54">Implemented in inspected baseline</text><text x="1176" y="678" class="body"><tspan x="1176">Software path and interface are represented;</tspan><tspan x="1176" dy="22">performance remains a separate verification claim.</tspan></text>
<text x="66" y="753" class="h2" fill="#C66A00">GCS ↔ Ground</text><text x="288" y="740" class="body"><tspan x="288">Target assignment / mission download</tspan><tspan x="288" dy="22">Status, progress and retrieval result</tspan></text><text x="856" y="741" class="status"><tspan x="856">End-to-end</tspan><tspan x="856" dy="22">validation pending</tspan></text><text x="1176" y="740" class="body"><tspan x="1176">Requires linked evidence from dispatch through</tspan><tspan x="1176" dy="22">ground response and physical retrieval outcome.</tspan></text>
