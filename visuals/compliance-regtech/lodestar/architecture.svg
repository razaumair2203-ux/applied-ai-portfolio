<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="title desc">
<title id="title">Lodestar grounded RAG architecture</title><desc id="desc">Ingestion, hybrid retrieval, authority policy, evidence objects and structured assessment controls.</desc>
<defs><linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08151b"/><stop offset="1" stop-color="#10252a"/></linearGradient><marker id="arr2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#5eead4"/></marker></defs>
<rect width="1600" height="860" rx="30" fill="url(#bg3)"/>
<text x="70" y="78" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="42" font-weight="700">Lodestar — grounded retrieval before generation</text>
<text x="72" y="118" fill="#9fc2c2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">PostgreSQL + pgvector • FTS + HNSW • RRF • authority policy • structured evidence controls</text>

<g font-family="Inter,Segoe UI,Arial,sans-serif">
<rect x="70" y="180" width="245" height="190" rx="22" fill="#112b2d" stroke="#14b8a6" stroke-width="2"/><text x="95" y="220" fill="#5eead4" font-size="20" font-weight="700">INGESTION</text><text x="95" y="265" fill="#e7fffb" font-size="21"><tspan x="95">structure-aware chunks</tspan><tspan x="95" dy="36">source metadata</tspan><tspan x="95" dy="36">BGE embeddings</tspan></text>
<rect x="360" y="180" width="275" height="190" rx="22" fill="#112b2d" stroke="#14b8a6" stroke-width="2"/><text x="385" y="220" fill="#5eead4" font-size="20" font-weight="700">POSTGRESQL</text><text x="385" y="265" fill="#e7fffb" font-size="21"><tspan x="385">full-text search</tspan><tspan x="385" dy="36">pgvector HNSW</tspan><tspan x="385" dy="36">metadata filters</tspan></text>
<rect x="680" y="180" width="260" height="190" rx="22" fill="#112b2d" stroke="#2dd4bf" stroke-width="2"/><text x="705" y="220" fill="#99f6e4" font-size="20" font-weight="700">HYBRID RETRIEVAL</text><text x="705" y="265" fill="#e7fffb" font-size="21"><tspan x="705">lexical + vector lanes</tspan><tspan x="705" dy="36">high-authority lanes</tspan><tspan x="705" dy="36">Reciprocal Rank Fusion</tspan></text>
<rect x="985" y="180" width="250" height="190" rx="22" fill="#112b2d" stroke="#a78bfa" stroke-width="2"/><text x="1010" y="220" fill="#c4b5fd" font-size="20" font-weight="700">EVIDENCE OBJECTS</text><text x="1010" y="265" fill="#f2edff" font-size="21"><tspan x="1010">citations + source type</tspan><tspan x="1010" dy="36">authority metadata</tspan><tspan x="1010" dy="36">deterministic rerank</tspan></text>
<rect x="1280" y="180" width="250" height="190" rx="22" fill="#112b2d" stroke="#f59e0b" stroke-width="2"/><text x="1305" y="220" fill="#fbbf24" font-size="20" font-weight="700">ASSESSMENT</text><text x="1305" y="265" fill="#fff7df" font-size="21"><tspan x="1305">LLM downstream</tspan><tspan x="1305" dy="36">citation filtering</tspan><tspan x="1305" dy="36">schema + refusal path</tspan></text>
<path d="M315 275 H350 M635 275 H670 M940 275 H975 M1235 275 H1270" stroke="#5eead4" stroke-width="4" marker-end="url(#arr2)"/>

<rect x="70" y="445" width="1460" height="260" rx="26" fill="#0d2023" stroke="#244044"/>
<text x="100" y="495" fill="#f8fafc" font-size="24" font-weight="700">Measured and runnable signals</text>
<g fill="#dcfdf7" font-size="23">
<text x="110" y="560"><tspan font-weight="700" fill="#5eead4">209</tspan><tspan> source documents*</tspan></text>
<text x="110" y="615"><tspan font-weight="700" fill="#5eead4">2,945</tspan><tspan> embedded chunks*</tspan></text>
<text x="110" y="670"><tspan font-weight="700" fill="#5eead4">34</tspan><tspan> frozen retrieval queries*</tspan></text>

<text x="570" y="560"><tspan font-weight="700" fill="#c4b5fd">1 / 34</tspan><tspan> top-5 expected-source misses*</tspan></text>
<text x="570" y="615"><tspan font-weight="700" fill="#c4b5fd">Real DB fixture</tspan><tspan> PostgreSQL + pgvector</tspan></text>
<text x="570" y="670"><tspan font-weight="700" fill="#c4b5fd">Authority ablation</tspan><tspan> candidate lanes + rerank</tspan></text>

<text x="1120" y="560"><tspan font-weight="700" fill="#fbbf24">10 cases</tspan><tspan> adversarial output eval</tspan></text>
<text x="1120" y="615"><tspan font-weight="700" fill="#fbbf24">5 states</tspan><tspan> canonical assessment schema</tspan></text>
<text x="1120" y="670"><tspan font-weight="700" fill="#fbbf24">Refusal path</tspan><tspan> when evidence collapses</tspan></text>
</g>
<text x="72" y="778" fill="#9fc2c2" font-size="18">* Recorded private-system state. Public fixtures execute the published retrieval/control mechanisms on non-sensitive data rather than recreating the private corpus.</text>
</g>
</svg>