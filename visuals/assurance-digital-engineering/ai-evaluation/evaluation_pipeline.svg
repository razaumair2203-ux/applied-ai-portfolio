<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Evaluation-driven AI workflow</title>
<desc id="desc">Frozen test cases split into train, validation, and held-out sets, followed by separate failure checks and a deployment gate that can block changes.</desc>
<rect width="1200" height="620" fill="#f8fafc"/>
<text x="60" y="70" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f172a">Evaluation-driven AI workflow</text>
<text x="60" y="108" font-family="Arial,sans-serif" font-size="18" fill="#475569">Historical JobLoop-AI evaluation design · aggregate public-safe view</text>
<rect x="60" y="155" width="300" height="110" rx="20" fill="#e0f2fe" stroke="#7dd3fc"/>
<text x="90" y="195" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0c4a6e">Frozen evaluation bank</text>
<text x="90" y="232" font-family="Arial,sans-serif" font-size="18" fill="#0c4a6e">50 cases · diverse roles / regions</text>
<path d="M360 210 L440 210" stroke="#64748b" stroke-width="5"/><polygon points="440,210 420,198 420,222" fill="#64748b"/>
<rect x="440" y="145" width="300" height="130" rx="20" fill="#eef2ff" stroke="#a5b4fc"/>
<text x="470" y="185" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#3730a3">Partition before tuning</text>
<text x="470" y="220" font-family="Arial,sans-serif" font-size="18" fill="#4338ca">20 train · 15 validation</text>
<text x="470" y="250" font-family="Arial,sans-serif" font-size="18" fill="#4338ca">15 held-out</text>
<path d="M740 210 L820 210" stroke="#64748b" stroke-width="5"/><polygon points="820,210 800,198 800,222" fill="#64748b"/>
<rect x="820" y="145" width="320" height="130" rx="20" fill="#ecfdf5" stroke="#86efac"/>
<text x="850" y="185" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#166534">Separate failure checks</text>
<text x="850" y="220" font-family="Arial,sans-serif" font-size="17" fill="#166534">fabrication · metrics · dates</text>
<text x="850" y="250" font-family="Arial,sans-serif" font-size="17" fill="#166534">parser + generation regressions</text>
<rect x="60" y="330" width="300" height="140" rx="20" fill="#fff7ed" stroke="#fdba74"/>
<text x="90" y="372" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#9a3412">Compare versions</text>
<text x="90" y="410" font-family="Arial,sans-serif" font-size="17" fill="#7c2d12">baseline vs candidate</text>
<text x="90" y="442" font-family="Arial,sans-serif" font-size="17" fill="#7c2d12">ground-truth corrections logged</text>
<path d="M360 400 L440 400" stroke="#64748b" stroke-width="5"/><polygon points="440,400 420,388 420,412" fill="#64748b"/>
<rect x="440" y="330" width="300" height="140" rx="20" fill="#fef2f2" stroke="#fca5a5"/>
<text x="470" y="372" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#991b1b">Statistical safeguard</text>
<text x="470" y="410" font-family="Arial,sans-serif" font-size="17" fill="#7f1d1d">materiality + significance</text>
<text x="470" y="442" font-family="Arial,sans-serif" font-size="17" fill="#7f1d1d">can block deployment</text>
<path d="M740 400 L820 400" stroke="#64748b" stroke-width="5"/><polygon points="820,400 800,388 800,412" fill="#64748b"/>
<rect x="820" y="330" width="320" height="140" rx="20" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="850" y="372" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a">Human release gate</text>
<text x="850" y="410" font-family="Arial,sans-serif" font-size="17" fill="#334155">review evidence + failure cases</text>
<text x="850" y="442" font-family="Arial,sans-serif" font-size="17" fill="#334155">approve, revise, or reject</text>
<text x="60" y="545" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Key signal: the retained safeguard blocked one candidate change because measured improvement was not statistically significant.</text>
</svg>