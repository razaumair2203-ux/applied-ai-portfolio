<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">Lodestar product landing surface</title>
<desc id="desc">Public-safe rendering of the current Lodestar frontend landing-page source, showing the evidence-assessment hero and scope cards.</desc>
<defs>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
    <path d="M36 0H0v36" fill="none" stroke="#ffffff" stroke-opacity=".06"/>
  </pattern>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity=".14"/>
  </filter>
</defs>
<rect width="1400" height="820" fill="#f8fafc"/>
<rect x="60" y="54" width="1280" height="430" rx="28" fill="#0a1022" filter="url(#shadow)"/>
<rect x="60" y="54" width="1280" height="430" rx="28" fill="url(#grid)"/>
<circle cx="760" cy="-10" r="260" fill="#6366f1" opacity=".11"/>
<rect x="110" y="104" width="304" height="36" rx="18" fill="none" stroke="#a5b4fc" stroke-opacity=".38"/>
<circle cx="132" cy="122" r="5" fill="#818cf8"/>
<text x="148" y="128" fill="#c7d2fe" font-family="Arial,sans-serif" font-size="15" font-weight="700">Evidence assessment — not a petition writer</text>
<text x="110" y="206" fill="#ffffff" font-family="Georgia,serif" font-size="54" font-weight="600">
  <tspan x="110" dy="0">Know exactly where your EB-2 NIW</tspan>
  <tspan x="110" dy="62">or EB-1A evidence stands</tspan>
</text>
<text x="110" y="350" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="22">
  <tspan x="110" dy="0">Criterion-by-criterion evidence assessment with retrieved authority,</tspan>
  <tspan x="110" dy="32">source-grounded citations and explicit limits on model authority.</tspan>
</text>
<rect x="110" y="406" width="188" height="52" rx="10" fill="#6366f1"/>
<text x="204" y="438" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="17" font-weight="700">Start assessment</text>
<rect x="316" y="406" width="276" height="52" rx="10" fill="none" stroke="#ffffff" stroke-opacity=".28"/>
<text x="454" y="438" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="17" font-weight="700">See a sample evidence matrix</text>

<rect x="60" y="528" width="620" height="232" rx="18" fill="#ffffff" filter="url(#shadow)"/>
<text x="98" y="572" fill="#64748b" font-family="Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="2">WHAT THIS TOOL DOES</text>
<g fill="#475569" font-family="Arial,sans-serif" font-size="18">
  <circle cx="106" cy="616" r="7" fill="#10b981" opacity=".18"/><path d="M102 616l3 3 6-8" fill="none" stroke="#059669" stroke-width="2"/><text x="128" y="622">Maps CV claims to the legal criteria for the selected track</text>
  <circle cx="106" cy="654" r="7" fill="#10b981" opacity=".18"/><path d="M102 654l3 3 6-8" fill="none" stroke="#059669" stroke-width="2"/><text x="128" y="660">Shows documented, thin, missing or contradicted evidence</text>
  <circle cx="106" cy="692" r="7" fill="#10b981" opacity=".18"/><path d="M102 692l3 3 6-8" fill="none" stroke="#059669" stroke-width="2"/><text x="128" y="698">Grounds legal points in retrieved authority the user can inspect</text>
  <circle cx="106" cy="730" r="7" fill="#10b981" opacity=".18"/><path d="M102 730l3 3 6-8" fill="none" stroke="#059669" stroke-width="2"/><text x="128" y="736">Asks targeted follow-up questions to close evidence gaps</text>
</g>

<rect x="720" y="528" width="620" height="232" rx="18" fill="#ffffff" filter="url(#shadow)"/>
<text x="758" y="572" fill="#64748b" font-family="Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="2">WHAT IT NEVER DOES</text>
<g fill="#475569" font-family="Arial,sans-serif" font-size="18">
  <circle cx="766" cy="616" r="7" fill="#ef4444" opacity=".14"/><path d="M762 612l8 8m0-8l-8 8" fill="none" stroke="#ef4444" stroke-width="2"/><text x="788" y="622">Draft a petition or filing language</text>
  <circle cx="766" cy="654" r="7" fill="#ef4444" opacity=".14"/><path d="M762 650l8 8m0-8l-8 8" fill="none" stroke="#ef4444" stroke-width="2"/><text x="788" y="660">Give a score, percentage or approval probability</text>
  <circle cx="766" cy="692" r="7" fill="#ef4444" opacity=".14"/><path d="M762 688l8 8m0-8l-8 8" fill="none" stroke="#ef4444" stroke-width="2"/><text x="788" y="698">Predict what an adjudicator will decide</text>
  <circle cx="766" cy="730" r="7" fill="#ef4444" opacity=".14"/><path d="M762 726l8 8m0-8l-8 8" fill="none" stroke="#ef4444" stroke-width="2"/><text x="788" y="736">Replace advice from a licensed immigration attorney</text>
</g>
<text x="70" y="802" fill="#94a3b8" font-family="Arial,sans-serif" font-size="14">Rendered from the current Lodestar frontend landing-page source; no separate logo asset exists in the project repository.</text>
</svg>