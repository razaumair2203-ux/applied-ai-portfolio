<text x="60" y="108" font-family="Arial,sans-serif" font-size="18" fill="#475569">Published regression fixtures + adversarial structured-output case</text>

<rect x="60" y="150" width="510" height="420" rx="24" fill="#ffffff" stroke="#cbd5e1"/>
