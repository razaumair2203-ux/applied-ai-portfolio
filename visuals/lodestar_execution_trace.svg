<text x="377" y="307" font-family="Arial,sans-serif" font-size="14" fill="#4338ca">FTS + pgvector</text>
<text x="377" y="330" font-family="Arial,sans-serif" font-size="14" fill="#4338ca">RRF + authority rerank</text>
<rect x="90" y="395" width="440" height="110" rx="18" fill="#ecfdf5" stroke="#86efac"/>
<text x="120" y="435" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#166534">Top-5 expected-source result</text>
