<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d">
<title id="t">Lodestar public execution and evaluation trace</title>
<desc id="d">A real public evaluation trace showing retrieval regression and a hallucinated citation being filtered into a refusal.</desc>
