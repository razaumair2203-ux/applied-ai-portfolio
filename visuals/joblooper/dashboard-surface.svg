<rect x="920" y="18" width="250" height="42" rx="11" fill="#0d1a23" stroke="#17313d"/>
<text x="942" y="44" fill="#738993" font-family="Arial,sans-serif" font-size="13">Search company, role or reference</text>
<rect x="1188" y="18" width="150" height="42" rx="10" fill="#4dd9e8"/>
<text x="1263" y="44" text-anchor="middle" fill="#040a0f" font-family="Arial,sans-serif" font-size="13" font-weight="800">+ New application</text>

<rect x="44" y="112" width="1312" height="144" rx="18" fill="#12232e" stroke="#34505d" filter="url(#s)"/>
<text x="72" y="148" fill="#4dd9e8" font-family="Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="2">WORKING APPLICATIONS</text>
<text x="72" y="190" fill="#eef6f8" font-family="Arial,sans-serif" font-size="34" font-weight="700">Continue where you left off</text>
<rect x="1040" y="150" width="272" height="68" rx="14" fill="#0d1a23" stroke="#24404b"/>
<text x="1064" y="176" fill="#738993" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1">NEXT CONTROLLED ACTION</text>
<text x="1064" y="202" fill="#eef6f8" font-family="Arial,sans-serif" font-size="15">Review the exact source before generation</text>

<text x="44" y="310" fill="#4dd9e8" font-family="Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="2">PORTFOLIO STATE</text>
<text x="44" y="366" fill="#eef6f8" font-family="Arial,sans-serif" font-size="52" font-weight="700">Apply from one place.</text>
<text x="44" y="420" fill="#b1c2ca" font-family="Arial,sans-serif" font-size="52" font-weight="400">Keep every decision traceable.</text>
<text x="44" y="468" fill="#b1c2ca" font-family="Arial,sans-serif" font-size="18">Paste the official job link, work with Codex, review every section, approve the bundle and preserve what happened.</text>

<g transform="translate(44,530)">
