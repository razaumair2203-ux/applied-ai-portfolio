<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="t d">
<title id="t">JobLooper application workspace</title>
<desc id="d">Public-safe rendering of the current JobLooper dashboard source, showing the command bar, portfolio-state hero and workflow controls.</desc>
<defs>
  <pattern id="g" width="52" height="52" patternUnits="userSpaceOnUse">
    <path d="M52 0H0v52" fill="none" stroke="#82c0d2" stroke-opacity=".025"/>
  </pattern>
  <filter id="s" x="-10%" y="-10%" width="120%" height="140%">
    <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity=".28"/>
  </filter>
</defs>
<rect width="1400" height="780" fill="#071017"/>
<rect width="1400" height="780" fill="url(#g)"/>
<rect x="0" y="0" width="1400" height="78" fill="#040a0f" stroke="#17313d"/>
<rect x="32" y="18" width="42" height="42" rx="12" fill="#102531" stroke="#34505d"/>
