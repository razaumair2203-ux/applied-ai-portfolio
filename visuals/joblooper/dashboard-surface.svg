  <text x="464" y="78" fill="#ab9cff" font-family="Arial,sans-serif" font-size="32" font-weight="700">Bounded</text>
  <text x="464" y="108" fill="#738993" font-family="Arial,sans-serif" font-size="12">cannot create candidate truth</text>

  <rect x="666" y="0" width="202" height="134" rx="18" fill="#0d1a23" stroke="#17313d"/>
  <text x="686" y="30" fill="#738993" font-family="Arial,sans-serif" font-size="11" font-weight="800">RELEASE</text>
  <text x="686" y="78" fill="#f1bf69" font-family="Arial,sans-serif" font-size="32" font-weight="700">Signed</text>
  <text x="686" y="108" fill="#738993" font-family="Arial,sans-serif" font-size="12">human approval before build</text>

  <rect x="888" y="0" width="202" height="134" rx="18" fill="#0d1a23" stroke="#17313d"/>
  <text x="908" y="30" fill="#738993" font-family="Arial,sans-serif" font-size="11" font-weight="800">OUTCOMES</text>
  <text x="908" y="78" fill="#eef6f8" font-family="Arial,sans-serif" font-size="32" font-weight="700">Recorded</text>
  <text x="908" y="108" fill="#738993" font-family="Arial,sans-serif" font-size="12">facts separated from hypotheses</text>

  <rect x="1110" y="0" width="202" height="134" rx="18" fill="#0d1a23" stroke="#17313d"/>
  <text x="1130" y="30" fill="#738993" font-family="Arial,sans-serif" font-size="11" font-weight="800">PRIVACY</text>
  <text x="1130" y="78" fill="#6bd7a5" font-family="Arial,sans-serif" font-size="32" font-weight="700">Local</text>
  <text x="1130" y="108" fill="#738993" font-family="Arial,sans-serif" font-size="12">no hosted candidate database</text>
</g>
<text x="44" y="744" fill="#738993" font-family="Arial,sans-serif" font-size="14">Rendered from the current public JobLooper dashboard source; official project icon is used separately in the portfolio.</text>
