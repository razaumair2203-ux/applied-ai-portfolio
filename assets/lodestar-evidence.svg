<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Lodestar measured RAG evidence</title>
<desc id="desc">209 documents, 2945 chunks, 2.9 percent top-5 grounding error, 53 backend tests, 17 of 17 stress tests, 12 of 12 concurrent flows.</desc>
<rect width="1200" height="360" fill="#0d1117" rx="18"/>
<text x="50" y="58" fill="#f0f6fc" font-family="Arial, sans-serif" font-size="30" font-weight="700">Lodestar — measured retrieval evidence</text>
<text x="50" y="90" fill="#8b949e" font-family="Arial, sans-serif" font-size="17">Working private build · public-safe metrics and implementation evidence</text>
<g font-family="Arial, sans-serif">
  <rect x="50" y="125" width="250" height="155" fill="#161b22" stroke="#30363d" rx="12"/>
  <text x="75" y="168" fill="#8b949e" font-size="16">SOURCE CORPUS</text>
  <text x="75" y="225" fill="#f0f6fc" font-size="46" font-weight="700">209</text>
  <text x="75" y="255" fill="#c9d1d9" font-size="18">documents</text>

  <rect x="325" y="125" width="250" height="155" fill="#161b22" stroke="#30363d" rx="12"/>
  <text x="350" y="168" fill="#8b949e" font-size="16">EMBEDDED CORPUS</text>
  <text x="350" y="225" fill="#f0f6fc" font-size="46" font-weight="700">2,945</text>
  <text x="350" y="255" fill="#c9d1d9" font-size="18">retrieval chunks</text>

  <rect x="600" y="125" width="250" height="155" fill="#161b22" stroke="#30363d" rx="12"/>
  <text x="625" y="168" fill="#8b949e" font-size="16">GROUNDING EVAL</text>
  <text x="625" y="225" fill="#f0f6fc" font-size="46" font-weight="700">2.9%</text>
  <text x="625" y="255" fill="#c9d1d9" font-size="18">top-5 error · 34 pairs</text>

  <rect x="875" y="125" width="275" height="155" fill="#161b22" stroke="#30363d" rx="12"/>
  <text x="900" y="168" fill="#8b949e" font-size="16">RELIABILITY</text>
  <text x="900" y="207" fill="#f0f6fc" font-size="24" font-weight="700">53 tests green</text>
  <text x="900" y="237" fill="#c9d1d9" font-size="18">17 / 17 stress</text>
  <text x="900" y="265" fill="#c9d1d9" font-size="18">12 / 12 concurrent flows</text>
</g>
<text x="50" y="326" fill="#8b949e" font-family="Arial, sans-serif" font-size="15">Metric boundary: retrieval grounding and software-test state; not legal correctness or outcome prediction.</text>
</svg>