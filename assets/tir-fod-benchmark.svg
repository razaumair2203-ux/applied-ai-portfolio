<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">TIR-FOD benchmark and deployment evidence</title>
<desc id="desc">3499 source frames, 5593 annotations, 23 classes, 29 YOLO runs, best observed mean mAP 0.8603 plus or minus 0.0017, contamination inflation 8.52 plus or minus 0.19 points, block-disjoint mAP 0.7410 versus frame-level 0.8223, Jetson TensorRT 25 FPS inference and 15.6 FPS end to end.</desc>
<rect width="1200" height="520" fill="#0d1117" rx="18"/>
<text x="50" y="58" fill="#f0f6fc" font-family="Arial, sans-serif" font-size="30" font-weight="700">TIR-FOD — benchmark + edge deployment evidence</text>
<text x="50" y="90" fill="#8b949e" font-family="Arial, sans-serif" font-size="17">Real runway LWIR acquisition · repeated training · leakage/generalisation checks · onboard TensorRT trials</text>

<g font-family="Arial, sans-serif">
  <rect x="50" y="125" width="245" height="120" fill="#161b22" stroke="#30363d" rx="12"/>
  <text x="75" y="162" fill="#8b949e" font-size="15">SOURCE DATA</text>
  <text x="75" y="205" fill="#f0f6fc" font-size="38" font-weight="700">3,499</text>
  <text x="75" y="231" fill="#c9d1d9" font-size="16">LWIR source frames</text>

  <rect x="315" y="125" width="245" height="120" fill="#161b22" stroke="#30363d" rx="12"/>
  <text x="340" y="162" fill="#8b949e" font-size="15">ANNOTATIONS</text>
  <text x="340" y="205" fill="#f0f6fc" font-size="38" font-weight="700">5,593</text>
  <text x="340" y="231" fill="#c9d1d9" font-size="16">boxes · 23 classes</text>

  <rect x="580" y="125" width="245" height="120" fill="#161b22" stroke="#30363d" rx="12"/>
  <text x="605" y="162" fill="#8b949e" font-size="15">TRAINING STUDY</text>
  <text x="605" y="205" fill="#f0f6fc" font-size="38" font-weight="700">29</text>
  <text x="605" y="231" fill="#c9d1d9" font-size="16">YOLO training runs</text>

  <rect x="845" y="125" width="305" height="120" fill="#161b22" stroke="#30363d" rx="12"/>
  <text x="870" y="162" fill="#8b949e" font-size="15">BEST OBSERVED MEAN</text>
  <text x="870" y="205" fill="#f0f6fc" font-size="38" font-weight="700">0.8603 ± 0.0017</text>
  <text x="870" y="231" fill="#c9d1d9" font-size="16">mAP@[.50:.95] · YOLOv8n</text>

  <text x="55" y="302" fill="#f0f6fc" font-size="20" font-weight="700">Generalisation / leakage diagnostics</text>
  <text x="55" y="340" fill="#c9d1d9" font-size="16">Acquisition-block-disjoint split</text>
  <rect x="300" y="323" width="333" height="22" fill="#30363d" rx="4"/>
  <rect x="300" y="323" width="247" height="22" fill="#58a6ff" rx="4"/>
  <text x="650" y="340" fill="#f0f6fc" font-size="16">0.7410 ± 0.0423</text>

  <text x="55" y="385" fill="#c9d1d9" font-size="16">Frame-level partition</text>
  <rect x="300" y="368" width="333" height="22" fill="#30363d" rx="4"/>
  <rect x="300" y="368" width="274" height="22" fill="#79c0ff" rx="4"/>
  <text x="650" y="385" fill="#f0f6fc" font-size="16">0.8223 ± 0.0070</text>

  <rect x="805" y="294" width="345" height="112" fill="#161b22" stroke="#30363d" rx="12"/>
  <text x="830" y="330" fill="#8b949e" font-size="15">CONTROLLED CONTAMINATION TEST</text>
  <text x="830" y="372" fill="#f0f6fc" font-size="31" font-weight="700">+8.52 ± 0.19 pp</text>
  <text x="830" y="398" fill="#c9d1d9" font-size="15">mAP inflation from held-out-source leakage</text>

  <text x="55" y="455" fill="#f0f6fc" font-size="20" font-weight="700">Jetson Orin Nano / TensorRT UAV trials</text>
  <text x="400" y="455" fill="#f0f6fc" font-size="25" font-weight="700">25.0 FPS</text>
  <text x="530" y="455" fill="#8b949e" font-size="16">inference</text>
  <text x="720" y="455" fill="#f0f6fc" font-size="25" font-weight="700">15.6 FPS</text>
  <text x="850" y="455" fill="#8b949e" font-size="16">end-to-end</text>
</g>
<text x="50" y="495" fill="#8b949e" font-family="Arial, sans-serif" font-size="14">All values are from the current TIR-FOD manuscript / dataset record; no synthetic benchmark values are introduced here.</text>
</svg>