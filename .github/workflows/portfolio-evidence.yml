name: Portfolio evidence smoke checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  public-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile public Python evidence
        run: |
          python -m py_compile \
            evidence/lodestar/legal_chunking.py \
            evidence/lodestar/hybrid_retrieval.py \
            evidence/lodestar/rerank.py \
            evidence/lodestar/public_smoke_test.py
      - name: Run zero-dependency Lodestar smoke checks
        run: python -m evidence.lodestar.public_smoke_test
