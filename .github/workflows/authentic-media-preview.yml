name: Build authentic-media previews

on:
  push:
    paths:
      - '.github/workflows/authentic-media-preview.yml'
      - 'media/showcase/tir-fod-23-class-evidence-atlas.svg'
      - 'media/showcase/clear-run-real-collector-sequence.svg'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install SVG renderer and image inspector
        run: python -m pip install --disable-pip-version-check cairosvg pillow
      - name: Render true-source media at native composition resolution
        run: |
          python - <<'PY'
          from pathlib import Path
          import cairosvg
          from PIL import Image
          pairs = [
              ('media/showcase/tir-fod-23-class-evidence-atlas.svg','media/showcase/tir-fod-23-class-evidence-atlas.png',(1600,1260)),
              ('media/showcase/clear-run-real-collector-sequence.svg','media/showcase/clear-run-real-collector-sequence.png',(1600,900)),
          ]
          for source, target, expected in pairs:
              cairosvg.svg2png(url=source,write_to=target)
              im=Image.open(target)
              im.load()
              assert im.size == expected, (target,im.size)
              assert im.getbbox() is not None, target
              print(target,im.size,Path(target).stat().st_size)
          PY
      - name: Publish rendered PNG media and preserve original SVG sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/showcase/tir-fod-23-class-evidence-atlas.png media/showcase/clear-run-real-collector-sequence.png
          if ! git diff --cached --quiet; then
            git commit -m "Render verifiable original-media evidence boards to PNG"
            git push
          fi
