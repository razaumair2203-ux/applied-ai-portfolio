name: Install authentic portfolio visuals

on:
  push:
    paths:
      - '.github/workflows/install-authentic-visuals.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode exact visual payload
        shell: bash
        run: |
          set -euo pipefail
          cat assets_payload/part*.txt > /tmp/payload.b64
          base64 -d /tmp/payload.b64 > /tmp/visuals.zip
          mkdir -p visuals
          unzip -o /tmp/visuals.zip -d visuals
          test -f visuals/clear_run_system_evidence.jpg
          test -f visuals/tir_fod_evidence.jpg
          test -f visuals/counter_uas_phase1_evidence.jpg
          test -f visuals/lodestar_product_ui.jpg
          test -f visuals/joblooper_governed_workflow_ui.jpg
          test -f visuals/codex_review_report_evidence.jpg
          rm -rf assets_payload
          rm -f .github/workflows/install-authentic-visuals.yml

      - name: Commit exact visuals
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish authentic project visual evidence"
          git push
