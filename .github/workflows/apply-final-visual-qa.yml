name: Apply final visual QA corrections

on:
  push:
    paths:
      - '.github/workflows/apply-final-visual-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and verify final authentic visual update
        shell: bash
        run: |
          set -euo pipefail
          cat visual_final_payload/part*.txt > /tmp/payload.b64
          base64 -d /tmp/payload.b64 > /tmp/visuals.zip
          unzip -t /tmp/visuals.zip
          unzip -o /tmp/visuals.zip -d visuals
          test -f visuals/tir_fod_evidence.jpg
          test -f visuals/codex_review_report_evidence.jpg
          rm -rf visual_final_payload
          rm -f .github/workflows/apply-final-visual-qa.yml
      - name: Commit final visual QA corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize authentic visual evidence QA"
          git push
